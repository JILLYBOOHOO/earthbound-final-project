<div class="cart-page container">
  <div class="cart-header">
    <h1 class="cart-title">Your Cart</h1>
    <p class="cart-subtitle" *ngIf="cartItems.length > 0">You have {{cartItems.length}} items in your pack.</p>
  </div>

  <div *ngIf="cartItems.length > 0; else emptyCart" class="cart-grid">
    <div class="cart-items-list">
      <div class="cart-item-card" *ngFor="let item of cartItems; let i = index">
        <div class="item-img">
          <img [src]="item.image_url || 'assets/placeholder.png'" [alt]="item.name">
        </div>
        <div class="item-info">
          <div class="item-meta">
            <span class="category">{{item.category}}</span>
            <h3 class="name">{{item.name}}</h3>
          </div>
          <div class="item-price-bin">
            <span class="price-val">${{item.price}}</span>
            <button class="remove-btn" (click)="removeItem(i)" aria-label="Remove item">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="cart-sidebar">
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span>${{total.toFixed(2)}}</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span class="free">FREE</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span>${{total.toFixed(2)}}</span>
        </div>
        <button class="checkout-btn premium-btn">
          Checkout Now <i class="fas fa-arrow-right"></i>
        </button>
        <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
      </div>
    </div>
  </div>

  <ng-template #emptyCart>
    <div class="empty-state">
      <div class="empty-icon">🛒</div>
      <h2>Your pack is empty!</h2>
      <p>Looks like you haven't picked up any gear for your next adventure yet.</p>
      <button routerLink="/shop" class="return-shop-btn">Continue Exploring</button>
    </div>
  </ng-template>
</div>
