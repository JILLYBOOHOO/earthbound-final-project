<header class="navbar">
    <div class="container">
      <a class="logo" routerLink="/" aria-label="Earthbound Home">Earthbound</a>
      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active">Home</a>
        <a routerLink="/shop" routerLinkActive="active">Shop</a>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
        <a *ngIf="isAdmin" routerLink="/admin" class="admin-link">Admin</a>
      </nav>
      <div class="search-bar">
        <input type="text" placeholder="Search..." [value]="searchQuery" (input)="onSearchInput($event)" (keyup.enter)="onSearch()">
        <button class="voice-btn" (click)="startVoiceSearch()" aria-label="Voice Search">
          <i class="fas fa-microphone"></i>
        </button>
      </div>
      <div class="icons">
        <a routerLink="/wishlist" class="icon-link wishlist-icon" aria-label="Wishlist">
          <i class="fas fa-heart"></i>
          <span class="btn-label">Wishlist</span>
          <span class="badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
        </a>
        <a routerLink="/cart" class="icon-link cart-icon" aria-label="Cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="btn-label">Cart</span>
          <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
        </a>
        <a *ngIf="!isLoggedIn" routerLink="/login" class="login-btn">Login</a>
        <div *ngIf="isLoggedIn" class="user-menu">
          <a routerLink="/profile" class="profile-link">Dashboard</a>
          <button (click)="onLogout()" class="logout-btn" aria-label="Logout">Logout</button>
        </div>
      </div>
    </div>
</header>
